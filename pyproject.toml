[project]
name = "caption-checker"
version = "0.1.0"
description = "Post-hoc detector for auto-generated caption (ASR) errors"
readme = "README.md"
authors = [
    { name = "ku-ro-wa", email = "kurowa.jp@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2.2",
    "click>=8.4.2",
    "fastapi>=0.115.0",
    "jellyfish>=1.2.1",
    "jinja2>=3.1.4",
    "metaphone>=0.6",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.17",
    "srt>=3.5.3",
    "uvicorn>=0.32.0",
    "webvtt-py>=0.5.1",
    "wordfreq>=3.1.1",
]

[project.optional-dependencies]
# Local embedding model for the context-anomaly detector. Pulls in torch
# (several hundred MB); the detector lazy-imports it and `check --no-embeddings`
# / a graceful skip keep it opt-in.
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
caption-checker = "caption_checker:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Only needed for fastapi.testclient.TestClient, not for `serve` itself.
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
