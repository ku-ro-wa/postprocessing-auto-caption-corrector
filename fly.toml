# One machine only: storage is plain directories and the spend ledger is
# guarded by an in-process lock (ADR 0010). Never scale past one.
app = "misheard"
primary_region = "sin"

[build]

[env]
  CAPTION_CHECKER_DATA_DIR = "/data"
  CAPTION_CHECKER_SECURE_COOKIE = "1"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Correct runs inside its request, so the machine must stay up.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
