# One machine only: storage is plain directories and the spend ledger is
# guarded by an in-process lock (ADR 0010). Never scale past one.
app = "misheard"
primary_region = "sin"
# On deploy the old process gets this long to finish in-flight requests (a
# Correct runs a minute or two) before it is killed. uvicorn stops accepting
# new connections on SIGINT and waits for the running ones.
kill_signal = "SIGINT"
kill_timeout = "180s"

[build]

[env]
  CAPTION_CHECKER_DATA_DIR = "/data"
  CAPTION_CHECKER_SECURE_COOKIE = "1"
  CAPTION_CHECKER_FEEDBACK_EMAIL = "misheard_app@outlook.com"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Correct runs inside its request, so the machine must stay up.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
