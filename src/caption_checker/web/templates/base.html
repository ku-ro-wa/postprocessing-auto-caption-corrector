<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  :root { color-scheme: light dark; --accent: #3563e9; --accent-hover: #2a50c4; --accent-text: #fff; --border: #8886; }
  /* break-word: a long filename, pasted link or unbroken caption breaks instead of widening the page on a phone. */
  body { font-family: system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; overflow-wrap: break-word; }
  /* Wraps rather than squeezes on a phone: the page's actions drop below the app name. */
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0.5rem 1rem; margin-bottom: 1.5rem; }
  .header-actions { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.5rem 1rem; }
  header a { text-decoration: none; color: inherit; font-weight: 600; }
  /* Translucent, like .notice, so the inherited text colour stays legible in both colour schemes. */
  .error { background: #c332; border: 1px solid #c33; padding: 0.5rem 0.75rem; border-radius: 4px; margin-bottom: 1rem; }
  .muted { opacity: 0.7; font-size: 0.9em; }
  .priming-terms { margin: 0.75rem 0; }
  .priming-terms label { display: block; margin-bottom: 0.25rem; }
  .priming-terms textarea { display: block; width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: 0.5rem; }
  .chip { cursor: pointer; font: inherit; font-size: 0.9rem; color: inherit; background: #8881; border: 1px solid var(--border); border-radius: 999px; padding: 0.3rem 0.8rem; min-height: 2rem; }
  .chip:hover { background: #8883; }
  .chip[aria-pressed="true"] { opacity: 0.55; }
  .chip[aria-pressed="true"]::before { content: "✓ "; }
  table { border-collapse: collapse; width: 100%; }
  /* A wide table scrolls inside this box, never the page. */
  .table-scroll { overflow-x: auto; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #ccc3; }
  .flag-card { border: 1px solid #ccc5; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  .flag-card.pending { border-left: 4px solid #999; }
  .flag-card.accepted { border-left: 4px solid #2a7; background: #2a72; }
  .flag-card.rejected { border-left: 4px solid #c33; opacity: 0.75; }
  .flag-card.dismissed { border-left: 4px solid #999; opacity: 0.6; }
  .flag-span { font-weight: 700; }
  /* Faded by colour, not opacity, so the status pill inside can stay full contrast. */
  .flag-meta { font-size: 0.85em; color: color-mix(in srgb, currentColor 75%, transparent); margin: 0.25rem 0; }
  .flag-context { margin: 0.4rem 0; }
  .flag-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
  .flag-actions input[type=text] { flex: 1 1 12rem; min-width: 0; }
  .flag-actions .accept-hint { flex-basis: 100%; }
  form.inline { display: inline; }
  .btn, input[type=file]::file-selector-button { cursor: pointer; font: inherit; font-weight: 600; font-size: 0.9rem; color: inherit; background: #8881; border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.9rem; transition: background 0.12s, border-color 0.12s; }
  .btn:hover:not(:disabled), input[type=file]::file-selector-button:hover { background: #8883; border-color: #888; }
  .btn:focus-visible, .btn-quiet:focus-visible, .chip:focus-visible, input[type=file]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { cursor: default; opacity: 0.55; }
  /* The one action a form is for: Upload & scan, Run AI read-through, Accept, Export. */
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  /* An action kept out of the way, like a page's Delete: reads as a muted link but keeps a button's tap target. */
  .btn-quiet { cursor: pointer; font: inherit; font-size: 0.9rem; color: inherit; opacity: 0.7; background: none; border: none; padding: 0.4rem 0.5rem; min-height: 2rem; text-decoration: underline; }
  .btn-quiet:hover { opacity: 1; }
  input[type=file] { font: inherit; font-size: 0.9rem; max-width: 100%; }
  /* One base for every text field. 16px or more, or phone browsers zoom in on focus. */
  input[type=text], input[type=password], textarea { font: inherit; font-size: max(16px, 1rem); color: FieldText; background: Field; border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; max-width: 100%; box-sizing: border-box; transition: border-color 0.12s; }
  input[type=text]:focus-visible, input[type=password]:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  input[type=file]::file-selector-button { margin-right: 0.75rem; }
  .upload-drop { border: 2px dashed var(--border); border-radius: 10px; padding: 1.25rem; text-align: center; background: #8880; transition: border-color 0.12s, background 0.12s; }
  .upload-drop p { margin: 0.5rem 0 0; font-size: 0.9rem; }
  .upload-drop:hover, .upload-drop:focus-within, .upload-drop.dragover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .upload-drop input[type=file]::file-selector-button { background: var(--accent); border-color: var(--accent); color: var(--accent-text); padding: 0.55rem 1.2rem; }
  .upload-drop input[type=file]::file-selector-button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  /* minmax(0, …) so the file input's natural width can't push the form past a phone's screen. */
  .upload-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.9rem; }
  .upload-form label { display: grid; gap: 0.25rem; }
  .hero { margin: 0 0 2rem; }
  .hero h1 { font-size: 2.4rem; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
  .hero .tagline { font-size: 1.3rem; margin: 0 0 0.75rem; font-weight: 600; }
  .hero p { margin: 0.25rem 0; }
  /* One step per row, the number hanging to the left, so a long step wraps across the width instead of stretching the short ones beside it. */
  .steps { display: grid; gap: 0.5rem; list-style: none; padding: 0; margin: 0.5rem 0 2rem; counter-reset: step; }
  .steps li { counter-increment: step; position: relative; border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem 0.75rem 3.1rem; }
  .steps li::before { content: counter(step); position: absolute; left: 1rem; top: 0.7rem; display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 0.85rem; }
  .steps strong { font-weight: 700; }
  .steps details { margin-top: 0.5rem; }
  .steps summary { cursor: pointer; }
  .steps details p { margin: 0.5rem 0 0; }
  footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .source-player { position: sticky; top: 0; z-index: 10; background: Canvas; padding: 0.5rem 0; margin-bottom: 1rem; border-bottom: 1px solid #ccc5; }
  .source-video-controls form { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
  .source-video-controls input[type=text] { flex: 1 1 12rem; min-width: 0; }
  /* Capped by viewport height too, so the pinned player never hides most of the Flags. */
  .source-player-frame { width: min(100%, 32rem, calc(28vh * 16 / 9)); aspect-ratio: 16 / 9; }
  .source-player.failed .source-player-frame { display: none; }
  .source-player-status:empty { display: none; }
  a.play-span { font-variant-numeric: tabular-nums; }
  /* The tabs and, in All Cues, the Flag stepper; on a narrow screen the stepper wraps above the tabs, so they keep the bottom border. The top padding keeps the pinned tabs off the browser's edge; the margin is trimmed by as much so the bar sits where it did unpinned. */
  .review-bar { position: sticky; top: var(--player-height, 0px); z-index: 9; background: Canvas; display: flex; flex-wrap: wrap-reverse; align-items: flex-end; justify-content: space-between; gap: 0.25rem 1rem; border-bottom: 1px solid #ccc5; margin: 0.5rem 0 0.75rem; padding-top: 0.5rem; }
  /* Set by the page's script once the list has scrolled under the bar, so the bar reads as lifted off it (#64). */
  .review-bar.scrolled { box-shadow: 0 6px 6px -6px color-mix(in srgb, CanvasText 45%, transparent); }
  .tabs { display: flex; gap: 0.25rem; }
  .tab { cursor: pointer; font: inherit; font-weight: 600; background: none; color: inherit; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; padding: 0.4rem 0.9rem; margin-bottom: -1px; }
  .tab[aria-selected=true] { border-color: #ccc5; background: Canvas; }
  .flag-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; padding-bottom: 0.3rem; font-size: 0.9rem; }
  .flag-nav[hidden] { display: none; }
  .flag-nav .btn { padding: 0.2rem 0.6rem; }
  #flag-position { font-variant-numeric: tabular-nums; }
  .flag-card, .cue-row { scroll-margin-top: calc(var(--player-height, 0px) + var(--bar-height, 2.5rem) + 0.5rem); }
  /* Pinned to the bottom corner, clear of the sticky player at the top; opaque so the list doesn't show through. */
  .back-to-top { position: fixed; right: 1rem; bottom: max(1rem, env(safe-area-inset-bottom)); z-index: 11; background: color-mix(in srgb, #888 12%, Canvas); box-shadow: 0 2px 8px #0003; transition: background 0.12s, border-color 0.12s, opacity 0.15s; }
  /* Fades in from hidden; leaving stays instant. */
  @starting-style { .back-to-top { opacity: 0; } }
  .back-to-top:hover:not(:disabled) { background: color-mix(in srgb, #888 25%, Canvas); }
  /* Room below the last Flag or Cue, so the pinned button never covers its controls. */
  #review-views { padding-bottom: 4rem; }
  .cue-row { padding: 0.4rem 0; border-bottom: 1px solid #ccc3; }
  /* Where Back to top landed: the first Flag card or Cue, outlined briefly, then faded (#64). */
  .arrived { outline: 2px solid var(--accent); outline-offset: 2px; animation: arrive 0.6s ease-in 0.4s forwards; }
  @keyframes arrive { to { outline-color: transparent; } }
  .cue-text { white-space: pre-line; }
  /* The same yellow as a Flag card's <mark>; the underline shows the Flag's status. */
  .cue-edit { margin-top: 0.25rem; }
  .cue-edit summary { cursor: pointer; font-size: 0.85rem; opacity: 0.7; }
  .cue-edit textarea { width: 100%; }
  .notice { background: #2a72; border: 1px solid #2a7; padding: 0.4rem 0.75rem; border-radius: 4px; margin-top: 0.4rem; }
  .badge { background: #36c3; border-radius: 3px; padding: 0 0.35rem; font-weight: 600; }
  .reason + .reason::before { content: "· "; }
  a.cue-flag { background: Mark; color: MarkText; text-decoration: none; border-bottom: 2px solid #999; }
  a.cue-flag.accepted { border-color: #2a7; }
  a.cue-flag.rejected { border-color: #c33; }
  a.cue-flag.dismissed { border-bottom-style: dashed; }
  /* The Flag reached from its card's cue link or the Flag stepper. */
  a.cue-flag.current { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  /* Full-strength text even inside a faded .flag-meta; rejected and dismissed cards still fade it a little. */
  .status-pill { font-size: 0.8rem; font-weight: 600; color: CanvasText; padding: 0.1rem 0.5rem; border-radius: 1rem; border: 1px solid currentColor; white-space: nowrap; }
  /* The review page's progress, accept-all and done banner (#63). */
  .review-progress { margin: 0.25rem 0 1rem; }
  .review-progress p { margin: 0.25rem 0; }
  .progress-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.75rem; font-variant-numeric: tabular-nums; }
  .progress-line progress { width: min(100%, 16rem); accent-color: var(--accent); }
  .ai-panel { border: 1px solid var(--border); border-radius: 8px; padding: 0.25rem 1rem 1rem; margin: 1rem 0; }
  .run-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; margin: 0.75rem 0; }
  .run-row .run-note { flex: 1 1 14rem; margin: 0; }
  .own-key { margin-top: 0.75rem; }
  .own-key summary { cursor: pointer; }
  .own-key label { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.5rem; margin: 0.5rem 0; }
  .own-key input[type=password] { flex: 1 1 12rem; min-width: 0; }
  .ai-summary { margin: 1rem 0; }
  .ai-summary p { margin: 0.25rem 0; }
  .done-banner > div { border: 1px solid #2a7; background: #2a72; border-radius: 8px; padding: 0.25rem 1rem 0.75rem; margin-bottom: 1rem; }
  .done-banner > div[hidden] { display: none; }
  .banner-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  a.btn { display: inline-block; text-decoration: none; }
  .done-banner summary { cursor: pointer; }
  .status-legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; font-size: 0.9rem; margin: 0.5rem 0 0.75rem; }
  /* The arrival outline is information, so it stays, just without the fade; the script removes it. */
  @media (prefers-reduced-motion: reduce) {
    .arrived { animation: none; }
    .back-to-top { transition: background 0.12s, border-color 0.12s; }
  }
</style>
</head>
<body>
<header>
  <a href="/">{{ app_name }}</a>
  <div class="header-actions">{% block header_extra %}{% endblock %}</div>
</header>
{% block content %}{% endblock %}
<footer class="muted">
  {{ app_name }}{% if feedback_email %} · <a href="mailto:{{ feedback_email }}?subject={{ (app_name ~ ' feedback')|urlencode }}">Send feedback</a>{% endif %}
</footer>
</body>
</html>
